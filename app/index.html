<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=1920, height=1080">
    <title>NIfty</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="wallpaper" class="wallpaper"></div>
    <div class="shade"></div>

    <header class="topbar">
        <div id="time" class="time">--:--</div>
        <nav class="actions">
            <button id="btn-all" class="action" data-action="all">
                <img class="glyph" src="icons/apps.svg" alt="">All apps
            </button>
            <button id="btn-edit" class="action" data-action="edit">
                <img class="glyph" src="icons/edit.svg" alt=""><span id="btn-edit-label">Edit dock</span>
            </button>
        </nav>
    </header>

    <div id="hint" class="hint"></div>

    <section class="dock-wrap">
        <div id="dock" class="dock" role="list"></div>
    </section>

    <section id="drawer" class="drawer" hidden>
        <div class="drawer-card">
            <div class="drawer-head">
                <h1 class="drawer-title">All apps</h1>
                <div id="drawer-hint" class="drawer-hint"></div>
            </div>
            <div id="grid" class="grid" role="list"></div>
            <div id="empty" class="empty" hidden>No apps found.</div>
        </div>
    </section>

    <div id="menu" class="menu" hidden>
        <div class="menu-card">
            <div id="menu-title" class="menu-title"></div>
            <div id="menu-items" class="menu-items"></div>
        </div>
    </div>

    <script src="wallpapers.js"></script>
    <script src="device.js"></script>
    <script src="main.js"></script>
</body>
</html>
